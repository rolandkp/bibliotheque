spring.datasource.url=jdbc:postgresql://localhost:5432/Bibliotheque_db
spring.datasource.username=postgres
spring.datasource.password=odoo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.port=8080
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
logging.level.com.example.bibliotheque=DEBUG

app.default-admin.email=admin@biblio.local
app.default-admin.password=admin123
